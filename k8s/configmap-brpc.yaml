apiVersion: v1
kind: ConfigMap
metadata:
  name: pairec-config
  namespace: pairec
data:
  datasystem_host: "127.0.0.1"
  datasystem_port: "31501"
  trt_num_samples: "1"
  trt_result_cache_enabled: "1"
  trt_max_kv_tokens: "1024"
  trt_scheduler_policy: "max_utilization"
  trt_max_input_len: "64"

  # PaiRec brpc 主配置。server_url 保留为 HTTP fallback，主路径走 brpc/TCP。
  pairec_config.json: |
    {
      "RunMode": "daily",
      "ListenConf": {
        "HttpAddr": "0.0.0.0",
        "HttpPort": 18080
      },
      "SceneConfs": {
        "home_feed": {
          "default": {
            "RecallNames": ["generative_recall", "milvus_recall"]
          }
        }
      },
      "SortNames": {
        "home_feed": ["boost_score_sort"]
      },
      "RecallConfs": [
        {
          "Name": "generative_recall",
          "RecallType": "GenerativeRecall",
          "RecallCount": 50,
          "CacheTime": 300,
          "CachePrefix": "gen_recall_",
          "RecallAlgo": "{\"protocol\":\"brpc\",\"brpc_endpoint\":\"inference-brpc-trtllm:18100\",\"brpc_service_name\":\"pairec.inference.RecommendService\",\"brpc_fallback_to_http\":true,\"server_url\":\"http://inference:18000\",\"timeout_ms\":5000,\"max_retries\":1,\"topk\":10,\"temperature\":1.0,\"beam_width\":1,\"history_from\":\"user_feature\",\"history_feature_name\":\"click_history\",\"history_delimiter\":\",\",\"history_max_length\":20}"
        },
        {
          "Name": "milvus_recall",
          "RecallType": "MilvusRecall",
          "RecallCount": 50,
          "CacheTime": 0,
          "ItemType": "video",
          "RecallAlgo": "{\"server_url\":\"http://dssm-recall-server:18200\",\"timeout_ms\":3000,\"topk\":20}"
        }
      ],
      "SortConfs": [
        {
          "Name": "boost_score_sort",
          "SortType": "BoostScoreSort"
        }
      ]
    }
