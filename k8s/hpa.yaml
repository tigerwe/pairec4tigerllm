# ============================================
# Horizontal Pod Autoscaler (Go 服务自动扩缩容)
# ============================================
# 推理服务不建议 HPA（GPU 资源受限），Go 服务可以
# ============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pairec-hpa
  namespace: pairec
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pairec
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 缩容前等待 5 分钟
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
