apiVersion: apps/v1
kind: Deployment
metadata:
  name: brpc-pressure-target
  namespace: pairec
  labels:
    app: brpc-pressure-target
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: brpc-pressure-target
  template:
    metadata:
      labels:
        app: brpc-pressure-target
    spec:
      nodeName: worker1
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: brpc-pressure-target
          image: docker.io/library/pairec-brpc-inference:k8s-arm64-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: LD_PRELOAD
              value: ""
          command:
            - /bin/bash
            - -c
          args:
            - |
              set -uo pipefail
              server=/opt/pairec-brpc/bin/brpc_inference_server
              semantic_map=/app/data/tenrec/processed/semantic_id_map.json
              "$server" --listen_port=18101 --backend=semantic_map --semantic_map_path="$semantic_map" &
              pid1=$!
              "$server" --listen_port=18102 --backend=semantic_map --semantic_map_path="$semantic_map" &
              pid2=$!
              trap 'kill -TERM "$pid1" "$pid2" 2>/dev/null || true; wait "$pid1" "$pid2" 2>/dev/null || true' EXIT INT TERM
              wait -n "$pid1" "$pid2"
              status=$?
              exit "$status"
          ports:
            - containerPort: 18101
              hostPort: 18101
              name: brpc-pressure-1
            - containerPort: 18102
              hostPort: 18102
              name: brpc-pressure-2
          resources:
            requests:
              cpu: "8"
              memory: "1Gi"
            limits:
              cpu: "16"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 18101
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 18102
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 18101
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            path: /home/zcx/workspace/pairec4tigerllm/data
            type: Directory
