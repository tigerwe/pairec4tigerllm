# ============================================
# Milvus standalone with embedded etcd (single Pod)
# ============================================
#
# 使用官方 Milvus 镜像内置的 embedded etcd + local storage。
# 通过 ConfigMap 注入 embedEtcd.yaml 和 user.yaml，把 etcd 端点固定到
# 127.0.0.1:2379，避免默认 "localhost" 被解析到 IPv6 [::1] 导致连接失败。
# 数据持久化到 master 节点的 hostPath /home/zcx/milvus-data。

apiVersion: v1
kind: ConfigMap
metadata:
  name: milvus-embed-config
  namespace: pairec
data:
  embedEtcd.yaml: |
    listen-client-urls: http://127.0.0.1:2379
    advertise-client-urls: http://127.0.0.1:2379
    quota-backend-bytes: 4294967296
    auto-compaction-mode: revision
    auto-compaction-retention: '1000'
  user.yaml: |
    etcd:
      endpoints:
        - 127.0.0.1:2379

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-standalone
  namespace: pairec
  labels:
    app: milvus-standalone
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: milvus-standalone
  template:
    metadata:
      labels:
        app: milvus-standalone
    spec:
      nodeName: master
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.4.15
          imagePullPolicy: IfNotPresent
          command:
            - milvus
            - run
            - standalone
          env:
            - name: ETCD_USE_EMBED
              value: "true"
            - name: ETCD_DATA_DIR
              value: /var/lib/milvus/etcd
            - name: ETCD_CONFIG_PATH
              value: /milvus/configs/embedEtcd.yaml
            - name: COMMON_STORAGETYPE
              value: local
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: metrics
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: milvus-data
              mountPath: /var/lib/milvus
            - name: milvus-config
              mountPath: /milvus/configs/embedEtcd.yaml
              subPath: embedEtcd.yaml
              readOnly: true
            - name: milvus-config
              mountPath: /milvus/configs/user.yaml
              subPath: user.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: milvus-data
          hostPath:
            path: /home/zcx/milvus-data
            type: DirectoryOrCreate
        - name: milvus-config
          configMap:
            name: milvus-embed-config

---

apiVersion: v1
kind: Service
metadata:
  name: milvus-standalone
  namespace: pairec
  labels:
    app: milvus-standalone
spec:
  selector:
    app: milvus-standalone
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: 9091
      protocol: TCP
  type: ClusterIP
