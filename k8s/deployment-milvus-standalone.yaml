# ============================================
# Milvus standalone (etcd + minio + milvus 同 Pod)
# ============================================
#
# 适用于 ARM64 K8s 节点。三个组件跑在同一个 Pod 内，通过 localhost 通信。
# 数据持久化到 master 节点的 hostPath /home/zcx/milvus-data。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-standalone
  namespace: pairec
  labels:
    app: milvus-standalone
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: milvus-standalone
  template:
    metadata:
      labels:
        app: milvus-standalone
    spec:
      nodeName: master
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.18
          imagePullPolicy: IfNotPresent
          env:
            - name: ETCD_AUTO_COMPACTION_MODE
              value: "revision"
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "1000"
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: "4294967296"
            - name: ALLOW_NONE_AUTHENTICATION
              value: "yes"
            - name: ETCD_DATA_DIR
              value: "/etcd"
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "http://localhost:2379"
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "http://0.0.0.0:2379"
          command:
            - etcd
          ports:
            - containerPort: 2379
              name: client
          volumeMounts:
            - name: etcd-data
              mountPath: /etcd
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "etcdctl --endpoints=http://localhost:2379 endpoint health"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

        - name: minio
          image: minio/minio:RELEASE.2024-06-13T22-53-53Z
          imagePullPolicy: IfNotPresent
          env:
            - name: MINIO_ROOT_USER
              value: "minioadmin"
            - name: MINIO_ROOT_PASSWORD
              value: "minioadmin"
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

        - name: milvus
          image: milvusdb/milvus:v2.4.15
          imagePullPolicy: IfNotPresent
          command:
            - milvus
            - run
            - standalone
          env:
            - name: ETCD_ENDPOINTS
              value: "localhost:2379"
            - name: MINIO_ADDRESS
              value: "localhost:9000"
            - name: MINIO_ACCESS_KEY
              value: "minioadmin"
            - name: MINIO_SECRET_KEY
              value: "minioadmin"
            - name: MINIO_USE_SSL
              value: "false"
            - name: MINIO_BUCKET_NAME
              value: "a-bucket"
            - name: MINIO_REGION
              value: "us-east-1"
          ports:
            - containerPort: 19530
              name: grpc
            - containerPort: 9091
              name: metrics
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: milvus-data
              mountPath: /var/lib/milvus
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9091
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: etcd-data
          hostPath:
            path: /home/zcx/milvus-data/etcd
            type: DirectoryOrCreate
        - name: minio-data
          hostPath:
            path: /home/zcx/milvus-data/minio
            type: DirectoryOrCreate
        - name: milvus-data
          hostPath:
            path: /home/zcx/milvus-data/milvus
            type: DirectoryOrCreate

---

apiVersion: v1
kind: Service
metadata:
  name: milvus-standalone
  namespace: pairec
  labels:
    app: milvus-standalone
spec:
  selector:
    app: milvus-standalone
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: 9091
      protocol: TCP
  type: ClusterIP
