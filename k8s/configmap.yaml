apiVersion: v1
kind: ConfigMap
metadata:
  name: pairec-config
  namespace: pairec
data:
  datasystem_host: "127.0.0.1"
  datasystem_port: "31501"
  trt_num_samples: "1"
  trt_result_cache_enabled: "1"
  trt_max_kv_tokens: "1024"
  trt_scheduler_policy: "max_utilization"
  trt_max_input_len: "64"

  # pairec 主配置
  pairec_config.json: |
    {
      "RunMode": "daily",
      "ListenConf": {
        "HttpAddr": "0.0.0.0",
        "HttpPort": 18080
      },
      "SceneConfs": {
        "home_feed": {
          "default": {
            "RecallNames": ["generative_recall"]
          }
        }
      },
      "SortNames": {
        "home_feed": ["boost_score_sort"]
      },
      "RecallConfs": [
        {
          "Name": "generative_recall",
          "RecallType": "GenerativeRecall",
          "RecallCount": 50,
          "CacheTime": 300,
          "CachePrefix": "gen_recall_",
          "RecallAlgo": "{\"server_url\":\"http://inference:18000\",\"timeout_ms\":5000,\"max_retries\":1,\"topk\":10,\"temperature\":1.0,\"beam_width\":1,\"history_from\":\"user_feature\",\"history_feature_name\":\"click_history\",\"history_delimiter\":\",\",\"history_max_length\":20}"
        }
      ],
      "SortConfs": [
        {
          "Name": "boost_score_sort",
          "SortType": "BoostScoreSort"
        }
      ]
    }

  # 旧版简化配置保留为参考，不被 Deployment 默认挂载使用。
  pairec_config_legacy.json: |
    {
      "recall": {
        "generative_recall": {
          "type": "GenerativeRecall",
          "model_name": "generative_recall",
          "recall_count": 50,
          "cache_adapter": "local",
          "cache_time": 300,
          "tiger_recall_conf": {
            "tiger_name": "http://inference:8000",
            "top_k": 50,
            "temperature": 1.0,
            "beam_width": 1,
            "history_from": "user_feature",
            "history_feature_name": "click_history",
            "history_delimiter": ",",
            "history_max_length": 20
          }
        }
      }
    }
