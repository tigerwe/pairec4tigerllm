apiVersion: apps/v1
kind: Deployment
metadata:
  name: brpc-burst-wrapper
  namespace: pairec
  labels:
    app: brpc-burst-wrapper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: brpc-burst-wrapper
  template:
    metadata:
      labels:
        app: brpc-burst-wrapper
    spec:
      nodeName: worker1
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: brpc-burst-wrapper
          image: docker.io/library/pairec-brpc-inference:k8s-arm64-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: LD_PRELOAD
              value: ""
          command:
            - /opt/pairec-brpc/bin/brpc_burst_wrapper
          args:
            - --listen_port=18103
            - --backend=192.168.100.11:18100
            - --backend_timeout_ms=5000
            - --backend_max_retry=0
            - --reverse_burst_endpoint=
            - --reverse_burst_stage=generation_return
            - --reverse_burst_concurrency=1000
            - --reverse_burst_payload_bytes=102400
            - --reverse_burst_marker_timeout_ms=1000
            - --reverse_burst_pressure_timeout_ms=5000
            - --reverse_burst_startup_timeout_ms=120000
            - --reverse_burst_startup_batch_size=64
            - --reverse_burst_startup_max_retries=3
            - --reverse_burst_startup_retry_backoff_ms=100
            - --idle_timeout_sec=-1
          ports:
            - containerPort: 18103
              hostPort: 18103
              name: brpc-wrapper
          resources:
            requests:
              cpu: "8"
              memory: "2Gi"
            limits:
              cpu: "8"
              memory: "2Gi"
          volumeMounts:
            - name: brpc-burst-wrapper-bin
              mountPath: /opt/pairec-brpc/bin/brpc_burst_wrapper
              readOnly: true
            - name: brpc-recommend-client-bin
              mountPath: /opt/pairec-brpc/bin/brpc_recommend_client
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 18103
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            exec:
              command:
                - /opt/pairec-brpc/bin/brpc_recommend_client
                - --server=127.0.0.1:18103
                - --method=health
                - --requests=1
                - --timeout_ms=1000
                - --max_retry=0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 18103
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: brpc-burst-wrapper-bin
          hostPath:
            path: /home/zcx/bin/brpc_burst_wrapper
            type: File
        - name: brpc-recommend-client-bin
          hostPath:
            path: /home/zcx/bin/brpc_recommend_client
            type: File
