apiVersion: apps/v1
kind: Deployment
metadata:
  name: brpc-burst-wrapper-master
  namespace: pairec
  labels:
    app: brpc-burst-wrapper-master
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: brpc-burst-wrapper-master
  template:
    metadata:
      labels:
        app: brpc-burst-wrapper-master
    spec:
      nodeName: master
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: brpc-burst-wrapper
          image: docker.io/library/pairec-brpc-inference:k8s-arm64-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: LD_PRELOAD
              value: ""
          command:
            - /opt/pairec-brpc/bin/brpc_burst_wrapper
          args:
            - --listen_port=18104
            - --backend=192.168.100.11:18100
            - --backend_timeout_ms=5000
            - --backend_max_retry=0
            - --idle_timeout_sec=-1
          ports:
            - containerPort: 18104
              hostPort: 18104
              name: brpc-wrapper
          resources:
            requests:
              cpu: "8"
              memory: "2Gi"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: brpc-burst-wrapper-bin
              mountPath: /opt/pairec-brpc/bin/brpc_burst_wrapper
              readOnly: true
          startupProbe:
            tcpSocket:
              port: 18104
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /opt/pairec-brpc/bin/brpc_recommend_client
                - --server=127.0.0.1:18104
                - --method=health
                - --requests=1
                - --timeout_ms=1000
                - --max_retry=0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 18104
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: brpc-burst-wrapper-bin
          hostPath:
            path: /home/zcx/bin/brpc_burst_wrapper
            type: File
