# ============================================
# 推荐服务 Deployment (Go, CPU)
# ============================================
# 特点: 无状态，可水平扩容
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pairec
  namespace: pairec
  labels:
    app: pairec
spec:
  replicas: 1  # 最小闭环先单副本，验证后再启用 HPA
  selector:
    matchLabels:
      app: pairec
  template:
    metadata:
      labels:
        app: pairec
    spec:
      containers:
        - name: pairec
          image: registry.example.com/pairec-server:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
              name: http
          env:
            - name: CONFIG_PATH
              value: "/app/configs/pairec_config.json"
            - name: INFERENCE_HOST
              value: "inference"
            - name: INFERENCE_PORT
              value: "18000"
            - name: PAIREC_PORT
              value: "18080"
            - name: PAIREC_ALSO_LOG_TO_STDERR
              value: "true"
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs
              readOnly: true
            - name: data-volume
              mountPath: /app/data
              readOnly: true
          livenessProbe:
            httpGet:
              path: /ping
              port: 18080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: 18080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config-volume
          configMap:
            name: pairec-config
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-pvc
